{% extends "base.html" %}
{% block conteudo %}
   
<h1>Filmes</h1>
    <p>Esta é a página de filmes.</p>

    <ul>

        {% for item in filmes %}
            <li class = "cartao">
                <h2>{{ item.titulo }}</h2>
                <p><strong>Ano:</strong> {{ item.ano }}</p>
                <p><strong>Gênero:</strong> {{ item.genero }}</p>
                <p><strong>Nota:</strong> {{ item.nota }}</p>
                <p><strong>Autor:</strong> {{ item.autor }}</p>
            </li>
        {% endfor %}
       

    </ul>   
{% endblock %}
